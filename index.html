<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Todo list</title>
    <link
      href="https://fonts.googleapis.com/css?family=Work+Sans:300,400,700,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/main.css" />
  </head>

  <body>
    <h1 class="title">Stuff I need to do</h1>

    <div class="all-tasks">
      <h2 class="tasks-list-title">My lists</h2>
      <ul class="tasks-list">
        <li class = "list-name-active-list"></li>
        <li class="list-name"></li>
        <li class="list-name"></li>
      </ul>

      <form action="">
        <input
          type="text"
          class="new list"
          placeholder="new list name"
          aria-label="new list name"
          />
          <button class="btn create" aria-label="create new list">+</button>
      </form>
    </div>

    <div class="todo-list">
      <div class="todo-header">
        <h2 class="list-title"></h2>
        <p class="task-count"></p>
      </div>
      <div class="todo-body">
        <div class="tasks">
          <div class="task">
            <input
             type="checkbox"
             id = "task-1"
             />
             <label for = "task-1">
              <span class="custom-checkbox"></span>
             </label>
          </div>
          <!-- /task-1 -->
        </div>
        <div class="new-task-creator">
          <form action="">
        <input
          type="text"
          class="new task"
          placeholder="new task name"
          aria-label="new task name"
          />
          <button class="btn create" aria-label="create new task">+</button>
      </form>
        </div>
        <div class="delete-tasks">
          <button class="btn delete">Clear completed tasks</button>
          <button class="btn delete">Delete list</button>
        </div>
      </div>
    </div>
    </div>
  </body>
</html>
